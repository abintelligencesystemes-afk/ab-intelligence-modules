[pytest]
# Tests pure-python (sans Odoo) — exécutables hors environnement Odoo.
# Pour lancer : ./run_tests.sh ou bien :
#   python -m pytest --import-mode=importlib --rootdir tests_pure tests_pure/
#
# NB : abrmd_grow_marketing/__init__.py importe `odoo` ; pytest doit donc être
# exécuté avec un rootdir pointant sur tests_pure/ pour éviter la collection
# du package parent.
addopts = --import-mode=importlib -p no:cacheprovider
testpaths = tests_pure

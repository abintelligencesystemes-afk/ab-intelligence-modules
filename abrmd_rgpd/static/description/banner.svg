<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#714B67"/>
      <stop offset="1" stop-color="#3d2535"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="340" fill="url(#bg)"/>
  <!-- Shield -->
  <g transform="translate(100, 90)">
    <path d="M 80 0 L 160 30 L 160 90 Q 160 150 80 175 Q 0 150 0 90 L 0 30 Z"
          fill="white" opacity="0.95"/>
    <path d="M 50 95 L 75 120 L 130 65" stroke="#714B67" stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Text -->
  <g transform="translate(330, 110)" fill="white" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
    <text font-size="48" font-weight="700">AI RGPD</text>
    <text y="56" font-size="22" opacity="0.9">Conformité RGPD complète en 6 piliers pour Odoo 19</text>
    <text y="100" font-size="16" opacity="0.75">Registre · Consentements · Droits personnes · Anonymisation · Logs · DPO Dashboard</text>
    <text y="170" font-size="14" opacity="0.6">AB Intelligence Systèmes — LGPL-3 — gratuit</text>
  </g>

  <!-- 6 pillars dots -->
  <g transform="translate(330, 240)">
    <circle cx="0" cy="0" r="6" fill="white" opacity="0.8"/><text x="14" y="5" fill="white" font-size="14" opacity="0.8" font-family="-apple-system, sans-serif">Art.30</text>
    <circle cx="90" cy="0" r="6" fill="white" opacity="0.8"/><text x="104" y="5" fill="white" font-size="14" opacity="0.8" font-family="-apple-system, sans-serif">Consents</text>
    <circle cx="210" cy="0" r="6" fill="white" opacity="0.8"/><text x="224" y="5" fill="white" font-size="14" opacity="0.8" font-family="-apple-system, sans-serif">Art.12-22</text>
    <circle cx="335" cy="0" r="6" fill="white" opacity="0.8"/><text x="349" y="5" fill="white" font-size="14" opacity="0.8" font-family="-apple-system, sans-serif">Anonymisation</text>
    <circle cx="500" cy="0" r="6" fill="white" opacity="0.8"/><text x="514" y="5" fill="white" font-size="14" opacity="0.8" font-family="-apple-system, sans-serif">Logs accès</text>
    <circle cx="635" cy="0" r="6" fill="white" opacity="0.8"/><text x="649" y="5" fill="white" font-size="14" opacity="0.8" font-family="-apple-system, sans-serif">Dashboard DPO</text>
  </g>
